# graf configuration. Copy to ~/.config/graf/config.toml (or point GRAF_CONFIG at it).
# Every key is optional. Environment variables override this file:
#   GRAF_GRAPH, GRAF_DATABASE_URL,
#   GRAF_LLM_BASE_URL, GRAF_LLM_API_KEY, GRAF_LLM_MODEL,
#   GRAF_EMBED_BASE_URL, GRAF_EMBED_API_KEY, GRAF_EMBED_MODEL,
#   GRAF_DECISION_BASE_URL, GRAF_DECISION_API_KEY,
#   GRAF_EVAL_JUDGE_MODEL, GRAF_EVAL_JUDGE_ROUTE, GRAF_EVAL_JUDGE_BASE_URL, GRAF_EVAL_JUDGE_API_KEY

graph = "default"

[database]
# Empty: graf manages a private local Postgres cluster.
url = ""

[llm]
# Any OpenAI- or Anthropic-compatible endpoint, including a self-hosted proxy.
base_url = "https://api.openai.com/v1"
api_key = ""
# openai-responses | anthropic-messages | openai-chat
route = "openai-responses"
model = "gpt-6.2-sol"
# Requests and input tokens per minute for this route; 0 means unlimited.
rpm = 0
input_tpm = 0
# Used for cost when the endpoint reports none, in USD per million tokens:
# "<model> input=<usd> output=<usd> [cache_read=<usd>] [cache_write=<usd>]"
rates = []
# Response header with the exact USD cost of each call, if your endpoint sends one.
cost_header = ""

[embed]
# base_url, api_key and cost_header default to the [llm] values.
model = "text-embedding-3-large"
dimensions = 512
rpm = 0
input_tpm = 0

[decision]
# Optional typed decision-model backend for resolution and reranking.
base_url = ""
api_key = ""
path = ""
rpm = 0
input_tpm = 0

[limits]
daily_usd = 100.0
monthly_usd = 1500.0
# Daily (UTC) spend that entries from `graf backfill` may use. Live entries always claim first,
# and backfill entries wait for the next day once this is spent.
backfill_daily_usd = 250.0
max_inflight = 8

[ingest]
workers = 4

[serve]
listen = "127.0.0.1:7420"
# Hub token for API clients and browser sign-in (GRAF_SERVE_TOKEN).
token = ""
# Optional read-only viewer sign-in via Tailscale Serve. See docs/hub.md.
# tailscale_origin = "https://hub.example.ts.net"
# tailscale_logins = ["user@example.org"]

[capture]
exclude_projects = []
exclude_paths = []

[edge]
# A hub URL turns `graf serve` into an edge: no database and no model calls, captured entries
# are spooled locally and pushed to the hub, and reads go to the hub (GRAF_UPSTREAM_URL).
upstream = ""
# The hub's serve.token (GRAF_UPSTREAM_TOKEN).
token = ""
timeout_ms = 10000

[eval]
# Model that judges unlabeled facts in `graf eval`; pick a different family than llm.model.
# Empty values fall back to the [llm] values.
judge_model = ""
judge_route = ""
judge_base_url = ""
judge_api_key = ""
